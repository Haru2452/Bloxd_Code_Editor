<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>bloxd.io Code Helper</title>
  <style>
    :root {
      --bg: #1a1a24; --editor: #12121a; --panel: #22222e; --border: #333344;
      --text: #d4d4e0; --muted: #7a7a90; --blue: #7aa2f7; --green: #9ece6a;
      --yellow: #e0af68; --cyan: #7dcfff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
      background: var(--bg); color: var(--text); height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .bar {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px;
      background: var(--panel); border-bottom: 1px solid var(--border); align-items: center;
    }
    .bar button {
      border: none; border-radius: 6px; padding: 8px 12px;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; color: #fff;
      -webkit-tap-highlight-color: transparent;
    }
    .bar button:active { opacity: 0.85; }
    .btn-copy { background: #179299; }
    .btn-share { background: #04a5e5; }
    .btn-docs { background: #8839ef; }
    .btn-clear { background: #4c4f69; }
    .btn-tip { background: #3d3d50; }
    .btn-refresh { background: #1e66f5; }
    .title { margin-right: auto; font-size: 0.8rem; color: var(--muted); padding-left: 4px; }
    .main { flex: 1; display: flex; min-height: 0; position: relative; }
    .editor-side { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .lines { display: flex; flex: 1; overflow: hidden; background: var(--editor); }
    .nums {
      width: 40px; padding: 12px 0; text-align: right;
      font: 13px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
      color: #555568; background: #0e0e14; border-right: 1px solid #2a2a36;
      overflow: hidden; user-select: none; flex-shrink: 0;
    }
    .nums div { padding-right: 8px; height: 20.15px; }
    textarea {
      flex: 1; border: none; outline: none; resize: none; background: transparent;
      color: var(--text); font: 13px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
      padding: 12px; white-space: pre; overflow: auto; caret-color: #f5e0dc; tab-size: 2;
    }
    .ac {
      position: absolute; z-index: 50; background: #1e1e2c; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      max-height: min(40vh, 280px);
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      display: none; min-width: 280px; max-width: 90vw; bottom: 12px; left: 44px;
    }
    .ac.show { display: block; }
    .ac-item {
      padding: 10px 12px; font: 13px/1.45 ui-monospace, Consolas, monospace;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px;
      -webkit-user-select: none; user-select: none; border-bottom: 1px solid #2a2a36;
    }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.on { background: #2a2a3e; }
    .ac-item .n { color: var(--blue); word-break: break-all; flex: 1; }
    .ac-item .k { font-size: 0.65rem; text-transform: uppercase; color: var(--muted); flex-shrink: 0; }
    .ac-item .k.api { color: var(--yellow); }
    .ac-item .k.cb { color: var(--green); }
    .ac-item .k.kw { color: var(--peach, #fab387); }
    #apiTip {
      position: absolute; z-index: 60; left: 12px; right: 12px;
      max-width: min(96vw, 520px); max-height: 42vh; overflow-y: auto;
      -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
      background: #2a2a36; border: 1px solid #3d3d50; border-radius: 6px;
      padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace;
      color: #cdd6f4; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.55);
      pointer-events: none;
    }
    #apiTip.show { display: block; }
    #apiTip .fn { color: #cdd6f4; margin-bottom: 2px; }
    #apiTip .pn { color: #fab387; }
    #apiTip .pt { color: #89dceb; word-break: break-word; }
    #apiTip .ret { color: #cba6f7; margin-top: 2px; }
    #apiTip .desc { color: #a6adc8; margin-top: 8px; font-family: -apple-system, sans-serif; font-size: 12px; line-height: 1.4; }
    .docs {
      width: min(320px, 100%); background: #16161e; border-left: 1px solid var(--border);
      display: none; flex-direction: column; flex-shrink: 0; overflow: hidden;
    }
    .docs.show { display: flex; }
    .docs-h {
      padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 600;
      font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }
    .docs-b { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 0.8rem; -webkit-overflow-scrolling: touch; }
    .docs-b a {
      display: block; color: var(--cyan); text-decoration: none; padding: 6px 0;
      border-bottom: 1px solid #252530;
    }
    .docs-b a:hover { color: var(--green); }
    .docs-b h4 {
      color: var(--yellow); margin: 14px 0 6px; font-size: 0.8rem;
      position: sticky; top: 0; background: #16161e; padding: 4px 0;
    }
    .docs-b h4:first-child { margin-top: 0; }
    .sig {
      background: #1a1a24; border: 1px solid var(--border); border-radius: 4px;
      padding: 7px 8px; font: 11px/1.35 ui-monospace, Consolas, monospace; color: var(--green);
      margin: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .sig:hover, .sig:active { border-color: var(--blue); background: #222230; }
    .status {
      padding: 4px 12px; background: #111118; border-top: 1px solid var(--border);
      font-size: 0.72rem; color: var(--muted); display: flex; justify-content: space-between;
    }
    .toast {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(12px);
      background: #2e2e3e; color: #fff; padding: 10px 18px; border-radius: 8px;
      font-size: 0.85rem; opacity: 0; transition: 0.2s; z-index: 100; pointer-events: none;
      max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .loading { color: var(--green); font-size: 0.75rem; padding: 0 4px; }
    @media (max-width: 640px) {
      .docs { position: absolute; right: 0; top: 0; bottom: 0; width: 100%; z-index: 40; }
      .title { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span class="title">bloxd.io · 補助エディタ</span>
    <span class="loading" id="loadStatus">内蔵一覧</span>
    <button class="btn-copy" type="button" onclick="copyCode()">Copy</button>
    <button class="btn-share" type="button" onclick="shareCode()">共有</button>
    <button class="btn-docs" type="button" onclick="toggleDocs()">Docs</button>
    <button class="btn-refresh" type="button" onclick="refreshDocs()">更新</button>
    <button class="btn-tip" type="button" id="tipBtn" onclick="toggleTip()">Hide Tips</button>
    <button class="btn-clear" type="button" onclick="clearEditor()">Clear</button>
  </div>
  <div class="main">
    <div class="editor-side">
      <div class="lines">
        <div class="nums" id="nums"></div>
        <textarea id="ed" spellcheck="false" placeholder="// コードを入力…\n// api. のあと → API候補\n// onPlayer など → Callback候補&#10;// Copy / 共有 でスマホでも取り出せます"></textarea>
      </div>
      <div class="ac" id="ac"></div>
    <div id="apiTip"></div>
    </div>
    <div class="docs" id="docs">
      <div class="docs-h">
        <span>Game API / Docs</span>
        <button type="button" style="background:#e64553;border:none;color:#fff;width:28px;height:28px;border-radius:5px;cursor:pointer;font-size:16px" onclick="toggleDocs()">×</button>
      </div>
      <div class="docs-b" id="docsBody">

        <a href="https://github.com/Bloxdy/code-api/blob/main/ENTITY_SETTINGS.md?plain=1" target="_blank" rel="noopener">エンティティ設定</a>
        <a href="https://github.com/Bloxdy/code-api/blob/main/MOB_SETTINGS.md?plain=1" target="_blank" rel="noopener">Mob設定</a>

        <a href="https://github.com/Bloxdy/code-api/blob/main/SKINS_AND_POSES.md?plain=1" target="_blank" rel="noopener">スキン・ポーズ</a>
        <a href="https://github.com/Bloxdy/code-api/blob/main/ICONS.md?plain=1" target="_blank" rel="noopener">アイコン一覧</a>

        <div id="docsLists"></div>
      </div>
    </div>
  </div>
  <div class="status">
    <span>Ln <span id="ln">1</span>, Col <span id="col">1</span></span>
    <span id="st">Ready</span>
  </div>
  <div class="toast" id="toast"></div>

"onWorldSpawnMob":{d:"Called when a mob is spawned by the world",r:"void",p:[{n:"mobId",t:"MobId"},{n:"mobType",t:"MobType"},{n:"x",t:"number"},{n:"y",t:"number"},{n:"z",t:"number"},{n:"mobHerdId",t:"MobHerdId"},{n:"playSoundOnSpawn",t:"boolean"}]},
"playerCommand":{d:"Called when a player sends a command",r:"void",p:[{n:"playerId",t:"string"},{n:"command",t:"string"}]},
"tick":{d:"Called every tick, 20 times per second",r:"void",p:[{n:"ms",t:"number"}]}
};
    const CB_SIGS = {
      "doPeriodicSave": "",
      "onAttemptKillPlayer": "killedPlayer, attackingLifeform",
      "onBlockStand": "playerId, x, y, z, blockName",
      "onBlockStandStart": "playerId, x, y, z, blockName",
      "onBlockStandStop": "playerId, x, y, z, blockName",
      "onChestUpdated": "initiatorEId, isMoonstoneChest, x, y, z",
      "onChunkLoaded": "chunkId, chunk, wasPersistedChunk",
      "onClientOptionUpdated": "playerId, option, value",
      "onClose": "serverIsShuttingDown",
      "onCreateBloxdMeshEntity": "eId, type, initiatorId",
      "onEntityCollision": "eId, otherEId",
      "onInventoryUpdated": "playerId",
      "onItemDropCreated": "itemEId, itemName, itemAmount, x, y, z",
      "onMobDamagingOtherMob": "attackingMob, damagedMob, damageDealt, withItem",
      "onMobDamagingPlayer": "attackingMob, damagedPlayer, damageDealt, withItem",
      "onMobDespawned": "mobId",
      "onMobKilledOtherMob": "attackingMob, killedMob, damageDealt, withItem",
      "onMobKilledPlayer": "attackingMob, killedPlayer, damageDealt, withItem",
      "onMobSettingUpdated": "mobId, setting, value",
      "onPlayerAltAction": "playerId, x, y, z, block, targetEId",
      "onPlayerAttack": "playerId",
      "onPlayerAttemptAltAction": "playerId, x, y, z, block, targetEId",
      "onPlayerAttemptCraft": "playerId, itemName, craftingIdx, craftTimes",
      "onPlayerAttemptOpenChest": "playerId, x, y, z, isMoonstoneChest, isIronChest",
      "onPlayerAttemptSpawnMob": "playerId, mobType, x, y, z",
      "onPlayerBoughtShopItem": "playerId, categoryKey, itemKey, item, userInput",
      "onPlayerBreakMeshEntity": "playerId, entityId",
      "onPlayerChangeBlock": "playerId, x, y, z, fromBlock, toBlock, droppedItem, fromBlockInfo, toBlockInfo",
      "onPlayerChat": "playerId, chatMessage, channelName",
      "onPlayerClick": "playerId, wasAltClick, x, y, z, block, targetEId",
      "onPlayerClickUp": "playerId, wasAltClick, x, y, z, block, targetEId",
      "onPlayerCraft": "playerId, itemName, craftingIdx, recipe, craftTimes",
      "onPlayerDamagingMeshEntity": "playerId, damagedId, damageDealt, withItem",
      "onPlayerDamagingMob": "playerId, mobId, damageDealt, withItem, damagerDbId",
      "onPlayerDamagingOtherPlayer": "attackingPlayer, damagedPlayer, damageDealt, withItem, bodyPartHit, damagerDbId",
      "onPlayerDropItem": "playerId, x, y, z, itemName, itemAmount, fromIdx",
      "onPlayerEnteredVehicle": "playerId, vehicleType, vehicleEId",
      "onPlayerExitedVehicle": "playerId, vehicleType, vehicleEId",
      "onPlayerFinishChargingItem": "playerId, used, itemName, duration",
      "onPlayerFinishQTE": "playerId, qteId, result",
      "onPlayerJoin": "playerId, fromGameReset",
      "onPlayerJump": "playerId",
      "onPlayerKilledMob": "playerId, mobId, damageDealt, withItem",
      "onPlayerKilledOtherPlayer": "attackingPlayer, killedPlayer, damageDealt, withItem",
      "onPlayerLeave": "playerId, serverIsShuttingDown",
      "onPlayerMoveInvenItem": "playerId, fromIdx, toStartIdx, toEndIdx, amt",
      "onPlayerMoveInvenItemWithAmt": "playerId, i, j, amt",
      "onPlayerMoveItemIntoIdxs": "playerId, start, end, moveIdx, itemAmount",
      "onPlayerMoveItemOutOfInventory": "playerId, itemName, itemAmount, fromIdx, movementType",
      "onPlayerOpenedChest": "playerId, x, y, z, isMoonstoneChest, isIronChest",
      "onPlayerPickedUpItem": "playerId, itemName, itemAmount, itemEntityId",
      "onPlayerPlayedEmote": "playerId, emoteId",
      "onPlayerPotionEffect": "initiatorId, targetId, effectName",
      "onPlayerRequestChunk": "playerId, chunkX, chunkY, chunkZ, chunkId",
      "onPlayerSelectInventorySlot": "playerId, slotIndex",
      "onPlayerSpawnMob": "playerId, mobId, mobType, x, y, z, mobHerdId, playSoundOnSpawn",
      "onPlayerStartChargingItem": "playerId, itemName",
      "onPlayerSwapInvenSlots": "playerId, i, j",
      "onPlayerThrowableHitTerrain": "playerId, throwableName, thrownEntityId",
      "onPlayerToggledShopMenu": "playerId, isOpen",
      "onPlayerUsedThrowable": "playerId, throwableName, thrownEntityId",
      "onRespawnRequest": "playerId",
      "onTaskClaimed": "playerId, taskId, isPromoTask, claimedRewards",
      "onTouchscreenActionButton": "playerId, touchDown",
      "onWorldAttemptDespawnMob": "mobId",
      "onWorldAttemptSpawnMob": "mobType, x, y, z",
      "onWorldChangeBlock": "x, y, z, fromBlock, toBlock, initiatorDbId, extraInfo",
      "onWorldSpawnMob": "mobId, mobType, x, y, z, mobHerdId, playSoundOnSpawn",
      "playerCommand": "playerId, command",
      "tick": "ms"
    };
    const BUILTIN_CB = ["doPeriodicSave", "onAttemptKillPlayer", "onBlockStand", "onBlockStandStart", "onBlockStandStop", "onChestUpdated", "onChunkLoaded", "onClientOptionUpdated", "onClose", "onCreateBloxdMeshEntity", "onEntityCollision", "onInventoryUpdated", "onItemDropCreated", "onMobDamagingOtherMob", "onMobDamagingPlayer", "onMobDespawned", "onMobKilledOtherMob", "onMobKilledPlayer", "onMobSettingUpdated", "onPlayerAltAction", "onPlayerAttack", "onPlayerAttemptAltAction", "onPlayerAttemptCraft", "onPlayerAttemptOpenChest", "onPlayerAttemptSpawnMob", "onPlayerBoughtShopItem", "onPlayerBreakMeshEntity", "onPlayerChangeBlock", "onPlayerChat", "onPlayerClick", "onPlayerClickUp", "onPlayerCraft", "onPlayerDamagingMeshEntity", "onPlayerDamagingMob", "onPlayerDamagingOtherPlayer", "onPlayerDropItem", "onPlayerEnteredVehicle", "onPlayerExitedVehicle", "onPlayerFinishChargingItem", "onPlayerFinishQTE", "onPlayerJoin", "onPlayerJump", "onPlayerKilledMob", "onPlayerKilledOtherPlayer", "onPlayerLeave", "onPlayerMoveInvenItem", "onPlayerMoveInvenItemWithAmt", "onPlayerMoveItemIntoIdxs", "onPlayerMoveItemOutOfInventory", "onPlayerOpenedChest", "onPlayerPickedUpItem", "onPlayerPlayedEmote", "onPlayerPotionEffect", "onPlayerRequestChunk", "onPlayerSelectInventorySlot", "onPlayerSpawnMob", "onPlayerStartChargingItem", "onPlayerSwapInvenSlots", "onPlayerThrowableHitTerrain", "onPlayerToggledShopMenu", "onPlayerUsedThrowable", "onRespawnRequest", "onTaskClaimed", "onTouchscreenActionButton", "onWorldAttemptDespawnMob", "onWorldAttemptSpawnMob", "onWorldChangeBlock", "onWorldSpawnMob", "playerCommand", "tick"];

    let SUG = [];
    let tipOn = true, idx = 0, list = [];
    const ed = document.getElementById("ed");
    const nums = document.getElementById("nums");
    const ac = document.getElementById("ac");

    function toast(m) {
      const t = document.getElementById("toast");
      t.textContent = m;
      t.classList.add("show");
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove("show"), 2200);
    }

        function cbIns(name) {
      const params = (typeof CB_SIGS !== "undefined" && CB_SIGS[name] != null) ? CB_SIGS[name] : "";
      return name + " = (" + params + ") => {\n  \n};";
    }
    function buildSug(cbs, apis) {
      const out = [];
      cbs.forEach(c => {
        if (!/^(on|tick|player|do)[A-Za-z0-9]*$/.test(c)) return;
        out.push({ name: c, k: "cb", ins: cbIns(c) });
      });
      apis.forEach(a => {
        const method = String(a).replace(/^api\./, "");
        if (!/^[a-zA-Z][a-zA-Z0-9]*$/.test(method)) return;
        out.push({ name: "api." + method, k: "api", ins: "api." + method, method: method });
      });
      ["preventDeath","preventChange","preventAction","preventDamage","preventDrop","preventCraft","keepInventory"].forEach(k => {
        out.push({ name: k, k: "kw", ins: '"' + k + '"' });
      });
      return out;
    }
    function renderDocsLists(cbs, apis) {
      const box = document.getElementById("docsLists");
      let html = "<h4>コールバック · " + cbs.length + "件</h4>";
      cbs.forEach(c => {
        if (!/^(on|tick|player|do)[A-Za-z0-9]*$/.test(c)) return;
        const ins = cbIns(c).replace(/\n/g, "&#10;");
        const params = (CB_SIGS && CB_SIGS[c]) || "";
        html += '<div class="sig" data-ins="' + ins + '">' + c + "(" + params + ")</div>";
      });
      html += "<h4>API · " + apis.length + "件（表示=印数 / 挿入は()のみ）</h4>";
      apis.forEach(a => {
        const method = String(a).replace(/^api\./, "");
        if (!/^[a-zA-Z][a-zA-Z0-9]*$/.test(method)) return;
        const d = (typeof API_DETAIL !== "undefined" && API_DETAIL[method]) ? API_DETAIL[method] : null;
        let shown = "api." + method + "()";
        if (d && d.p && d.p.length) {
          shown = "api." + method + "(" + d.p.map(function(x){ return x.n; }).join(", ") + ")";
        }
        html += '<div class="sig" data-ins="api.' + method + '" data-method="' + method + '">' + shown + '</div>';
      });
      box.innerHTML = html;
      box.querySelectorAll(".sig").forEach(function(el) {
        el.onclick = function() {
          var ins = el.getAttribute("data-ins").replace(/&#10;/g, "\n");
          var pos = ed.selectionStart;
          ed.value = ed.value.slice(0, pos) + ins + ed.value.slice(pos);
          ed.selectionStart = ed.selectionEnd = pos + ins.length;
          updateNums();
          ed.focus();
          var m = el.getAttribute("data-method");
          if (m) showApiTip(m);
          toast("挿入しました");
        };
      });
    }
    function applyLists(cbs, apis, label) {
      SUG = buildSug(cbs, apis);
      renderDocsLists(cbs, apis);
      document.getElementById("loadStatus").textContent = label;
      document.getElementById("st").textContent = "API " + apis.length + " · CB " + cbs.length;
    }

    function parseCallbacks(md) {
      const names = new Set();
      md.split("\n").forEach(line => {
        const m = line.match(/^## ([a-zA-Z][a-zA-Z0-9]*)\s*$/);
        if (m && (/^(on|tick|player|do)/.test(m[1]))) names.add(m[1]);
      });
      names.delete("Callbacks");
      return Array.from(names).sort();
    }
    function parseApis(md) {
      const names = [];
      md.split("\n").forEach(line => {
        const m = line.match(/^## ([a-zA-Z][a-zA-Z0-9]*)\s*$/);
        if (m) names.push(m[1]);
      });
      return names;
    }

    async function refreshDocs() {
      const st = document.getElementById("loadStatus");
      st.textContent = "更新中…";
      st.style.color = "var(--yellow)";
      try {
        const [cbRes, apiRes] = await Promise.all([
          fetch("https://raw.githubusercontent.com/Bloxdy/code-api/main/CALLBACKS.md", { cache: "no-store" }),
          fetch("https://raw.githubusercontent.com/Bloxdy/code-api/main/API_REFERENCE.md", { cache: "no-store" })
        ]);
        if (!cbRes.ok || !apiRes.ok) throw new Error("fetch failed");
        const cbs = parseCallbacks(await cbRes.text());
        const apis = parseApis(await apiRes.text());
        if (!cbs.length || !apis.length) throw new Error("empty");
        applyLists(cbs, apis, "最新");
        st.style.color = "var(--green)";
        toast("最新を取得（API " + apis.length + " / CB " + cbs.length + "）");
        try { localStorage.setItem("bloxd_api_cache", JSON.stringify({ cbs, apis, t: Date.now() })); } catch (e) {}
      } catch (err) {
        st.textContent = "内蔵一覧";
        st.style.color = "var(--green)";
        toast("外部取得不可 → 内蔵一覧を使用");
      }
    }

    function updateNums() {
      const n = ed.value.split("\n").length;
      let h = "";
      for (let i = 1; i <= Math.max(n, 12); i++) h += "<div>" + i + "</div>";
      nums.innerHTML = h;
      nums.scrollTop = ed.scrollTop;
    }
    function updatePos() {
      const t = ed.value.slice(0, ed.selectionStart).split("\n");
      document.getElementById("ln").textContent = t.length;
      document.getElementById("col").textContent = t[t.length - 1].length + 1;
    }
    function word() {
      const m = ed.value.slice(0, ed.selectionStart).match(/([a-zA-Z_][\w.]*)$/);
      return m ? m[1] : "";
    }
    function showAc() {
      if (!tipOn || !SUG.length) { hideAc(); return; }
      const w = word();
      if (w.length < 1) { hideAc(); return; }
      const l = w.toLowerCase();
      // API候補は「api.」と打ち始めてからだけ表示
      if (l.startsWith("api.")) {
        const q = l.slice(4);
        list = SUG.filter(s => s.k === "api" && s.name.toLowerCase().startsWith("api." + q)).slice(0, 40);
      } else if (l === "api") {
        hideAc();
        return;
      } else {
        // コールバック・キーワードのみ。先頭一致（includes だと a で大量ヒットするため）
        // 1文字だけならコールバックは出さない（誤爆防止）
        if (l.length < 2) { hideAc(); return; }
        list = SUG.filter(s => {
          if (s.k !== "cb" && s.k !== "kw") return false;
          const n = s.name.toLowerCase();
          return n.startsWith(l);
        }).slice(0, 40);
      }
      if (!list.length) { hideAc(); return; }
      idx = 0;
      drawAc();
      ac.classList.add("show");
    }
    function drawAc() {
      ac.innerHTML = list.map((s, i) =>
        '<div class="ac-item ' + (i === idx ? "on" : "") + '" data-i="' + i + '">' +
          '<span class="n">' + s.name + '</span>' +
          '<span class="k ' + s.k + '">' + (s.k === "api" ? "API" : s.k === "cb" ? "CB" : "KW") + '</span>' +
        '</div>'
      ).join("");
      let touchY0 = 0, scrolled = false;
      ac.querySelectorAll(".ac-item").forEach(el => {
        el.onmousedown = function(e) { e.preventDefault(); pick(list[+el.dataset.i]); };
        el.ontouchstart = function(e) {
          touchY0 = e.touches[0].clientY;
          scrolled = false;
        };
        el.ontouchmove = function(e) {
          if (Math.abs(e.touches[0].clientY - touchY0) > 8) scrolled = true;
        };
        el.ontouchend = function(e) {
          if (!scrolled) {
            e.preventDefault();
            pick(list[+el.dataset.i]);
          }
        };
      });
      const on = ac.children[idx];
      if (on) on.scrollIntoView({ block: "nearest" });
    }
    
    
    function hideApiTip() {
      const tip = document.getElementById("apiTip");
      if (tip) tip.classList.remove("show");
    }
    function renderSigTip(name, kind) {
      const tip = document.getElementById("apiTip");
      if (!tip) return;
      let info = null;
      let title = name;
      if (kind === "api") {
        info = (typeof API_DETAIL !== "undefined") ? API_DETAIL[name] : null;
        title = "api." + name;
      } else {
        info = (typeof CB_DETAIL !== "undefined") ? CB_DETAIL[name] : null;
      }
      if (!info) { tip.classList.remove("show"); return; }
      let h = '<div class="fn"><span style="color:#89b4fa">' + title + "</span>(";
      if (info.p && info.p.length) {
        h += "<br>" + info.p.map(function(x) {
          return '&nbsp;&nbsp;<span class="pn">' + x.n + '</span>: <span class="pt">' + x.t + "</span>";
        }).join("<br>") + "<br>";
      }
      h += '): <span class="ret">' + (info.r || "void") + "</span></div>";
      if (info.d) h += '<div class="desc">' + info.d + "</div>";
      tip.innerHTML = h;
      tip.classList.add("show");
      // 候補が出ているときは少し上へ
      const acEl = document.getElementById("ac");
      if (acEl && acEl.classList.contains("show")) {
        tip.style.bottom = (12 + Math.min(acEl.offsetHeight || 0, 180) + 10) + "px";
      } else {
        tip.style.bottom = "56px";
      }
    }
    /** カーソル位置から api.xxx( または callback = ( を検出してツールチップ表示 */
    function updateContextTip() {
      if (!tipOn) { hideApiTip(); return; }
      const pos = ed.selectionStart;
      const before = ed.value.slice(0, pos);
      // カーソルより前で、まだ閉じていない直近の ( を基準に関数名を取る
      // 例: api.applyEffect(  /  onPlayerJoin = (  /  onPlayerJoin=(
      const tail = before.slice(-400);
      // API: api.name(
      let m = tail.match(/api\.([a-zA-Z][a-zA-Z0-9]*)\s*\([^)]*$/);
      if (m && typeof API_DETAIL !== "undefined" && API_DETAIL[m[1]]) {
        renderSigTip(m[1], "api");
        return;
      }
      // Callback 統一: name = (  または name(
      m = tail.match(/\b((?:on|tick|player|do)[a-zA-Z0-9]*)\s*=\s*\([^)]*$/);
      if (m && typeof CB_DETAIL !== "undefined" && CB_DETAIL[m[1]]) {
        renderSigTip(m[1], "cb");
        return;
      }
      m = tail.match(/\b((?:on|tick|player|do)[a-zA-Z0-9]*)\s*\([^)]*$/);
      if (m && typeof CB_DETAIL !== "undefined" && CB_DETAIL[m[1]]) {
        renderSigTip(m[1], "cb");
        return;
      }
      // 候補リスト表示中は drawAc 側に任せる
      if (ac.classList.contains("show") && list[idx]) return;
      hideApiTip();
    }
    function hideAc() { ac.classList.remove("show"); list = []; }
    function pick(s) {
      const pos = ed.selectionStart;
      const before = ed.value.slice(0, pos);
      const after = ed.value.slice(pos);
      const w = word();
      const nb = before.slice(0, before.length - w.length) + s.ins;
      ed.value = nb + after;
      ed.selectionStart = ed.selectionEnd = nb.length;
      hideAc();
      updateNums();
      updatePos();
      ed.focus();
      // 選択したあとに印数を表示（API / Callback 共通）
      if (s.k === "api" && s.method) renderSigTip(s.method, "api");
      else if (s.k === "cb") renderSigTip(s.name, "cb");
      else hideApiTip();
    }

    ed.addEventListener("input", function() { updateNums(); updatePos(); showAc(); updateContextTip(); });
    ed.addEventListener("scroll", function() { nums.scrollTop = ed.scrollTop; });
    ed.addEventListener("click", function() { updatePos(); updateContextTip(); });
    ed.addEventListener("keyup", function(e) {
      updateContextTip();
      if (["ArrowUp","ArrowDown","Enter","Tab","Escape"].indexOf(e.key) === -1) { updatePos(); showAc(); }
    });
    ed.addEventListener("keydown", function(e) {
      if (e.key === "Tab") {
        e.preventDefault();
        if (ac.classList.contains("show") && list.length) { pick(list[idx]); return; }
        const s = ed.selectionStart, en = ed.selectionEnd;
        ed.value = ed.value.slice(0, s) + "  " + ed.value.slice(en);
        ed.selectionStart = ed.selectionEnd = s + 2;
        updateNums();
      }
      if (ac.classList.contains("show")) {
        if (e.key === "ArrowDown") { e.preventDefault(); idx = Math.min(idx + 1, list.length - 1); drawAc(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); idx = Math.max(idx - 1, 0); drawAc(); }
        else if (e.key === "Enter") { e.preventDefault(); if (list[idx]) pick(list[idx]); }
        else if (e.key === "Escape") hideAc();
      }
    });

    function copyCode() {
      var text = ed.value;
      if (!text.trim()) { toast("コピーするコードがありません"); return; }
      ed.focus();
      ed.select();
      ed.setSelectionRange(0, text.length);
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function() {
          toast("コピーしました");
          document.getElementById("st").textContent = "Copied";
        }).catch(function() { tryExecCopy(text); });
        return;
      }
      tryExecCopy(text);
    }
    function tryExecCopy(text) {
      try {
        if (document.execCommand("copy")) {
          toast("コピーしました");
          document.getElementById("st").textContent = "Copied";
          return;
        }
      } catch (e) {}
      toast("全文選択中 → 長押しで「コピー」");
      document.getElementById("st").textContent = "手動コピー";
    }
    function shareCode() {
      var text = ed.value;
      if (!text.trim()) { toast("共有するコードがありません"); return; }
      if (navigator.share) {
        navigator.share({ text: text }).catch(function() { copyCode(); });
      } else {
        copyCode();
      }
    }
    function toggleDocs() { document.getElementById("docs").classList.toggle("show"); }
    function toggleTip() {
      tipOn = !tipOn;
      document.getElementById("tipBtn").textContent = tipOn ? "Hide Tips" : "Show Tips";
      if (!tipOn) hideAc();
      toast(tipOn ? "候補 ON" : "候補 OFF");
    }
    function clearEditor() {
      if (ed.value && !confirm("エディタを空にしますか？")) return;
      ed.value = "";
      updateNums();
      updatePos();
      hideAc();
      ed.focus();
      toast("クリアしました");
    }

    applyLists(BUILTIN_CB, BUILTIN_API, "内蔵一覧");
    updateNums();
    refreshDocs();
    ed.focus();
  </script>
</body>
